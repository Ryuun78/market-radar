name: Enable Market Radar Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/market-radar-enable-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages from gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          response="$(mktemp)"
          status="$(
            curl -L -sS \
              -o "$response" \
              -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          )"

          cat "$response"
          case "$status" in
            201|409)
              exit 0
              ;;
            422)
              if grep -qi "already" "$response"; then
                exit 0
              fi
              exit 1
              ;;
            *)
              echo "Unexpected GitHub Pages API status: $status"
              exit 1
              ;;
          esac
