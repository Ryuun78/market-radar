    const state={view:"overview",market:"all",period:"1w",query:"",theme:"ai",candidate:""};
    const mult={ "1w":.34,"1m":1,"3m":1.82,"1y":3.4 }, shape={ "1w":[0,.2,.55,.34,.78,1],"1m":[0,.35,.18,.62,.74,1],"3m":[0,.18,.5,.42,.77,1],"1y":[0,.22,.38,.26,.72,1] };
    function stocks(t,m=state.market){let raw=m==="KR"?t[4]:m==="US"?t[3]:t[3]+","+t[4];return raw.split(",").map((x,i)=>mk(x,t,i,m==="all"?i<10?"US":"KR":m))}
    function mk(x,t,i,m){const [symbol,name]=x.split("|"),seed=t[0].charCodeAt(0)+symbol.charCodeAt(0)+i*7,score=Math.max(44,94-i*4-(seed%7));return{theme:t[1],themeId:t[0],cat:t[2],symbol,name,market:m,score,ret:3.2+i*.45+(seed%9)*.42,vol:2.8+(seed%8)*.38,dd:5.6+(i%5)*1.15+(seed%4)}}
    function visibleThemes(){const q=state.query.trim().toLowerCase();return themes.map((t,i)=>({...themeObj(t,i),stocks:stocks(t)})).filter(t=>!q||t.name.toLowerCase().includes(q)||t.cat.toLowerCase().includes(q)||t.stocks.some(s=>(s.name+s.symbol).toLowerCase().includes(q)))}

    function ret(s){return +(s.ret*mult[state.period]).toFixed(1)}
    function dd(s){return +(s.dd*Math.sqrt(mult[state.period])).toFixed(1)}
    function peer(s){return +(ret(s)+(s.score%5)-2.4).toFixed(1)}
    function vol(s){return +(s.vol*Math.sqrt(mult[state.period])).toFixed(1)}

    function chart(s){const vals=shape[state.period].map((p,i)=>+(ret(s)*p-(i===2?dd(s)/6:0)).toFixed(1)),min=Math.min(-5,...vals),max=Math.max(5,...vals),pts=vals.map((v,i)=>`${46+i*112.8},${235-(v-min)/(max-min)*215}`).join(" ");return`<svg class="chart" viewBox="0 0 640 270"><line x1="46" x2="610" y1="235" y2="235" stroke="#d9dee8" stroke-dasharray="4 5"/><line x1="46" x2="610" y1="${235-(0-min)/(max-min)*215}" y2="${235-(0-min)/(max-min)*215}" stroke="#d9dee8" stroke-dasharray="4 5"/><polyline points="${pts}" fill="none" stroke="#108943" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${46+i*112.8}" cy="${235-(v-min)/(max-min)*215}" r="4" fill="#108943"/>`).join("")}${labels().map((l,i)=>`<text x="${46+i*112.8}" y="258" text-anchor="middle" fill="#667085" font-size="12">${l}</text>`).join("")}</svg>`}
    function pickCandidate(){const list=candidates();if(!list.some(s=>key(s)===state.candidate))state.candidate=key(list[0]||stocks(themes[0])[0]);return list.find(s=>key(s)===state.candidate)||list[0]||stocks(themes[0])[0]}
    function key(s){return s.market+":"+s.symbol}
    function fmt(v){return(v>0?"+":"")+v}
    function periodLabel(){return periods.find(p=>p[0]===state.period)[1]}
    function marketLabel(){return markets.find(m=>m[0]===state.market)[1]}
    function nav(){return[["overview","종합상황","↗"],["candidates","AI 후보군","◎"],["watch","관심","☆"],["alerts","알림","◌",4],["settings","설정","⚙"]].map(n=>`<button class="${state.view===n[0]?"on":""}" data-view="${n[0]}"><i>${n[2]}</i><span>${n[1]}</span>${n[3]?`<b class="badge">${n[3]}</b>`:""}</button>`).join("")}
    function shell(inner){document.querySelector("#app").innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="mark">MR</div><div><b>Market Radar</b><span>AI 후보군</span></div></div><nav class="nav">${nav()}</nav><div class="indices"><p>주요 지수 <span>${new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false})}</span></p><div><span>KOSPI</span><b>2,762.31</b><em class="up">+0.52%</em></div><div><span>KOSDAQ</span><b>842.11</b><em class="down">-0.23%</em></div><div><span>S&P 500</span><b>5,308.15</b><em class="up">+0.59%</em></div><div><span>NASDAQ</span><b>16,742.39</b><em class="up">+0.81%</em></div></div><p class="note">AI가 후보군을 줄이고<br>차트 판단은 이포가 합니다.</p></aside><main><header class="top">${seg("market",markets)}${seg("period",periods)}<label class="search"><span>⌕</span><input id="q" value="${state.query}" placeholder="후보, 테마, 종목 검색"></label><div class="clock"><span>공개 페이지</span><b>${new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})}</b></div></header>${inner}</main></div>`;bind()}
    function seg(name,items){return`<div class="group"><span>${name==="market"?"시장 범위":"기간"}</span><div class="seg">${items.map(i=>`<button class="${state[name]===i[0]?"on":""}" data-seg="${name}" data-val="${i[0]}">${i[1]}</button>`).join("")}</div></div>`}
    function overview(){const ts=visibleThemes(),cs=candidates(),sel=pickCandidate(),theme=themes.find(t=>t[0]===state.theme)||themes[0];shell(`<div class="page"><section class="hero"><small>AI 후보군 작업대</small><h1>${marketLabel()} ${periodLabel()} 후보 ${cs.length}개</h1><p>변동성, 상대 낙폭, 거래대금 회복 기준으로 1차 후보만 압축합니다.</p></section><section class="grid">${themePanel(ts)}${candidateTable(cs)}${detail(sel)}</section><section class="grid two">${stockPanel(theme)}${cards(sel)}</section></div>`)}
    function candidatePage(){const cs=candidates(),sel=pickCandidate();shell(`<div class="page"><section class="hero"><small>AI 후보군</small><h1>${marketLabel()} 상장 종목 기준 Top ${cs.length}</h1></section><section class="grid two">${candidateTable(cs)}${detail(sel)}</section></div>`)}
    function themePanel(ts){return`<section class="panel"><div class="hd"><div><h2>강한 업황 후보 Top 10</h2><span>${marketLabel()} · ${periodLabel()}</span></div></div><div class="theme-list">${ts.slice(0,10).map(t=>`<button class="theme ${state.theme===t.id?"on":""}" data-theme="${t.id}"><b>${t.rank}</b><span><strong>${t.name}</strong><small>${t.cat}</small></span><span><span class="bar"><i style="width:${t.score}%"></i></span><em class="score">${t.score}</em></span></button>`).join("")}</div></section>`}
    function candidateTable(cs){return`<section class="panel"><div class="hd"><div><h2>AI 후보군</h2><span>${marketLabel()} · ${periodLabel()} 기준</span></div></div><div class="table"><div class="head"><span>순위</span><span>종목</span><span>국가</span><span>AI</span><span>수익</span><span>상대 비교</span><span>낙폭</span></div>${cs.map((s,i)=>`<button class="row ${state.candidate===key(s)?"on":""}" data-cand="${key(s)}"><b class="rank">${i+1}</b><span><strong>${s.name}</strong><small>${s.symbol} · ${s.theme}</small></span><span>${s.market}</span><span><b class="pill">${adj(s)}</b></span><span class="${ret(s)>=0?"up":"down"}">${fmt(ret(s))}%</span><span>${peer(s)<ret(s)?"상대강도 유지형":"덜 오르고 많이 빠진 후보"}</span><span>${fmt(dd(s))}%</span></button>`).join("")}</div></section>`}
    function stockPanel(t){const rows=stocks(t).slice(0,10);return`<section class="panel"><div class="hd"><div><h2>${t[1]} 관련 종목 Top 10</h2><span>${marketLabel()} 범위 · ${periodLabel()} 기준</span></div></div><div><div class="stock-head"><span>순위</span><span>종목</span><span>국가</span><span>AI</span><span>변화</span></div>${rows.map((s,i)=>`<button class="stock-row" data-cand="${key(s)}"><b>${i+1}</b><span><strong>${s.name}</strong><small>${s.symbol}</small></span><span>${s.market}</span><span><b class="pill">${adj(s)}</b></span><span class="${ret(s)>=0?"up":"down"}">${fmt(ret(s))}%</span></button>`).join("")}</div></section>`}
    function detail(s){return`<aside class="panel"><div class="hd"><div><h2>${s.name}</h2><span>${s.symbol} · ${s.market} · ${s.theme}</span></div></div><div class="detail"><div class="bigscore"><b>${adj(s)}</b><span><strong>AI 후보 점수</strong><small class="muted">${periodLabel()} 기준</small></span></div><div class="metrics"><p class="metric"><span>기간 수익</span><b class="${ret(s)>=0?"up":"down"}">${fmt(ret(s))}%</b></p><p class="metric"><span>변동성</span><b>${vol(s)}%</b></p><p class="metric"><span>동종 대비</span><b>${fmt((ret(s)-peer(s)).toFixed(1))}p</b></p><p class="metric"><span>낙폭</span><b>${fmt(dd(s))}%</b></p></div>${chart(s)}<div class="review"><p><b>의자패턴</b><span>받침 구간에서 거래대금 회복 여부 확인</span></p><p><b>변동성</b><span>${vol(s)>5?"변동성 확대형":"변동성 평균권"}</span></p><p><b>상대 비교</b><span>${peer(s)<ret(s)?"동종 대비 견조":"덜 오르고 많이 빠진 후보"}</span></p><p><b>제외 기준</b><span>받침 하단 이탈과 거래대금 감소가 겹치면 제외</span></p></div></div></aside>`}
    function cards(s){return`<div class="cards"><div class="mini"><span>상장 시장</span><b>${s.market}</b></div><div class="mini"><span>테마</span><b>${s.theme}</b></div><div class="mini"><span>상대 수익 차이</span><b>${fmt((ret(s)-peer(s)).toFixed(1))}p</b></div><div class="mini"><span>차트 기간</span><b>${periodLabel()}</b></div></div>`}
    function simpleView(title,body,side=""){shell(`<div class="page"><section class="hero"><small>${title}</small><h1>${marketLabel()} ${periodLabel()}</h1></section><section class="grid two"><section class="panel"><div class="hd"><h2>${title}</h2></div>${body}</section>${side||detail(pickCandidate())}</section></div>`)}
    function render(){if(state.view==="candidates")return candidatePage();if(state.view==="watch")return simpleView("관심",`<div class="rows">${candidates().slice(0,6).map(s=>`<button class="row" data-cand="${key(s)}"><b class="rank">☆</b><span><strong>${s.name}</strong><small>${s.symbol} · ${s.theme}</small></span><span>${s.market}</span><span><b class="pill">${adj(s)}</b></span></button>`).join("")}</div>`,stockPanel(themes.find(t=>t[0]===state.theme)||themes[0]));if(state.view==="alerts")return simpleView("알림",`<div class="alerts"><button><span><strong>AI 서버 업황 강도 90 돌파</strong><small class="muted">후보군 점검</small></span><b class="up">신규</b></button><button><span><strong>${marketLabel()} ${periodLabel()} 후보 갱신</strong><small class="muted">상장 시장 기준 재정렬</small></span><b>완료</b></button><button><span><strong>변동성 확대 후보 확인</strong><small class="muted">차트 판독 필요</small></span><b class="down">주의</b></button></div>`);if(state.view==="settings")return simpleView("설정",`<div class="settings">${["AI 서버 업황 강도","전력 인프라 업황 강도","HBM 업황 강도","리더 교체 발생"].map((x,i)=>`<button><span><strong>${x}</strong><small class="muted">알림 활성화</small></span><i class="toggle ${i!==2?"on":""}"></i></button>`).join("")}</div>`);overview()}
    function bind(){document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{state[b.dataset.seg]=b.dataset.val;state.candidate="";render()});document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;render()});document.querySelectorAll("[data-cand]").forEach(b=>b.onclick=()=>{state.candidate=b.dataset.cand;state.view="candidates";render()});document.querySelector("#q").oninput=e=>{state.query=e.target.value;render();const q=document.querySelector("#q");q.focus();q.setSelectionRange(state.query.length,state.query.length)}}
    render();
  </script>
</body>
</html>
